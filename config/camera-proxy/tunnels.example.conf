# Túneis do camera-proxy: uma linha por câmera/serviço.
# Formato: PORTA_LOCAL  IP_DA_CAMERA  PORTA_REMOTA
#
# Copie para tunnels.conf e ajuste. A câmera fica acessível para o Horus em
# camera-proxy:PORTA_LOCAL — use isso como host na URL RTSP do wizard, ex.:
#   rtsp://usuario:senha@camera-proxy:10001/cam/realmonitor?channel=1&subtype=0
#
# Para PTZ/ONVIF (HTTP), encaminhe também a porta ONVIF da câmera (geralmente
# 80 ou 8000) em outra porta local.

10001  192.168.1.101  554
# 10002  192.168.1.102  554
# 18001  192.168.1.101  80
