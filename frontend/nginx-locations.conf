# Shared locations for the Horus SPA (included by both :80 and :443 blocks).

root /usr/share/nginx/html;
index index.html;

client_max_body_size 50m;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Backend REST + WebSocket (/api/v1/ws/*)
location /api/ {
    proxy_pass http://backend-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# go2rtc (WebRTC signaling WS, LL-HLS, frames) — prefix stripped
location /go2rtc/ {
    proxy_pass http://go2rtc:1984/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Hashed static assets — cache aggressively
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# SPA with history fallback
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
