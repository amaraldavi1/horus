# Horus VMS frontend — HTTP server block.
# HTTPS (443) lives in /etc/nginx/horus/ssl.conf and is copied into conf.d
# by /docker-entrypoint.d/45-enable-ssl.sh only when certificates exist at
# /etc/nginx/certs/server.crt|server.key — so HTTP-only setups work untouched.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    include /etc/nginx/snippets/horus-locations.conf;
}
